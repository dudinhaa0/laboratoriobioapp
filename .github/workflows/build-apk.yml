
name: Gerar APK - LaboratorioBioApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Gerar arquivos React
        run: npm run build

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar pacotes Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Preparar Gradle
        run: chmod +x gradlew
        working-directory: android

      - name: Compilar APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LaboratorioBioApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
